databases:
  - name: autoline-db
    databaseName: dealer
    user: dealer
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: autoline-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build --workspace @dealer/shared && npm run build --workspace @dealer/api
    preDeployCommand: npm run db:migrate --workspace @dealer/api
    initialDeployHook: npm run db:seed --workspace @dealer/api
    startCommand: npm run start --workspace @dealer/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: autoline-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
