services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealer
      POSTGRES_PASSWORD: dealer
      POSTGRES_DB: dealer
    ports:
      - "5432:5432"
    volumes:
      - dealer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealer -d dealer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dealer_pgdata:
